# 真实环境验收测试模板：复制为 application-real.yml 并填入实际地址/密码（该文件已被 .gitignore 排除，不入库）
spring:
  datasource:
    url: jdbc:mysql://YOUR_MYSQL_HOST:3306/dag_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: YOUR_MYSQL_USER
    password: YOUR_MYSQL_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

logging:
  level:
    com.dag: info

dag:
  enabled: true
  demo:
    enabled: false
  scheduler:
    enabled: true
    interval-ms: 500
    batch-size: 100
  executor:
    threads: 8
  node:
    timeout-seconds: 5
  lock:
    # 单机 Redis：填可写主节点/读写地址；生产 Redis Cluster 改填 redis-cluster-addresses（逗号分隔）
    redis-required: true
    redis-address: redis://YOUR_REDIS_HOST:6379
    redis-password: YOUR_REDIS_PASSWORD
    redis-cluster-addresses:
